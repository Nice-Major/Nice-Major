name: Instant Job Tailoring & PDF Application Generator

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: 'Job Posting URL (Workday, Greenhouse, Lever, etc.)'
        required: false
        default: ''
        type: string
      job_text:
        description: 'Or paste raw Job Description text directly here'
        required: false
        default: ''
        type: string
      company_name:
        description: 'Hiring Company / Organization Name (auto-detected if blank)'
        required: false
        default: ''
        type: string
      role_title:
        description: 'Target Role Title Override (auto-detected if blank)'
        required: false
        default: ''
        type: string
      send_email:
        description: 'Email tailored PDF CV & PDF Cover Letter to aniekwevictor9@gmail.com'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  tailor_job:
    name: Evaluate & Generate Tailored PDF CV + Cover Letter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository (Nice-Major/Nice-Major)
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Evaluate Job & Generate Opportunity-Tied PDF Package
        env:
          CANDIDATE_NAME: 'John Victor Aniekwe'
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL || 'aniekwevictor9@gmail.com' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'aniekwevictor9@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || '' }}
          SMTP_USE_TLS: 'true'
          SMTP_SENDER: ${{ secrets.SMTP_SENDER || 'aniekwevictor9@gmail.com' }}
          INPUT_URL: ${{ github.event.inputs.job_url }}
          INPUT_TEXT: ${{ github.event.inputs.job_text }}
          INPUT_COMPANY: ${{ github.event.inputs.company_name }}
          INPUT_ROLE: ${{ github.event.inputs.role_title }}
        run: |
          ARGS=("apply" "--output-dir" "output/instant_application")
          if [ -n "$INPUT_URL" ]; then
            ARGS+=("--url" "$INPUT_URL")
          fi
          if [ -n "$INPUT_TEXT" ]; then
            ARGS+=("--text" "$INPUT_TEXT")
          fi
          if [ -n "$INPUT_COMPANY" ]; then
            ARGS+=("--company" "$INPUT_COMPANY")
          fi
          if [ -n "$INPUT_ROLE" ]; then
            ARGS+=("--role" "$INPUT_ROLE")
          fi
          if [ "${{ github.event.inputs.send_email }}" = "true" ]; then
            ARGS+=("--email")
            if [ -n "$SMTP_PASSWORD" ]; then
              ARGS+=("--live")
            fi
          fi
          python cli/main.py "${ARGS[@]}"

      - name: Upload Tailored PDF Application Package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailored-pdf-application-${{ github.run_id }}
          path: |
            output/instant_application/*.pdf
            output/instant_application/*.md
            output/instant_application/*.eml
          retention-days: 30
          if-no-files-found: ignore
